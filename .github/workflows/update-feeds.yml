# Refreshes data/feeds.json (Letterboxd and other connectors) every hour and commits it
# when something changed. GitHub Pages / Netlify then redeploy the site automatically.
name: Update feeds

on:
  schedule:
    - cron: "17 * * * *" # every hour, at :17
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python3 connectors/fetch_feeds.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "feeds-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update feeds"
            git push
          fi
