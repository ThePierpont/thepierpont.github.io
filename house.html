<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pierpont's apartment</title>
<meta name="description" content="Come on in: a cartoon cyberpunk apartment where each room shows what I'm watching, reading and up to.">
<meta name="theme-color" content="#07050f">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Pierpont's apartment">
<meta property="og:description" content="Come on in.">
<meta property="og:url" content="https://pierpont.blog/house">
<meta property="og:image" content="https://pierpont.blog/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=1793693448">
<link rel="stylesheet" href="house.css?v=1793693448">
</head>
<body class="house">
<canvas id="house" aria-hidden="true"></canvas>

<header class="h-top">
  <a class="h-brand" href="./">PIERPONT<span>// HOME</span></a>
  <span class="h-room" id="h-room" aria-live="polite">Front door</span>
  <div class="h-btns">
    <button type="button" id="h-back" hidden>← Back</button>
    <a href="./">Exit to site</a>
  </div>
</header>
<p class="h-hint" id="h-hint"></p>
<div class="h-tip" id="h-tip" hidden></div>
<div class="h-toast" id="h-toast" role="status" hidden></div>

<!-- Keyboard and screen-reader way around the apartment (shown when focused). -->
<nav class="h-nav" aria-label="Rooms">
  <button type="button" data-go="living">Open the door and go inside</button>
  <button type="button" data-go="theater">Go to the theater</button>
  <button type="button" data-go="screen">Read my latest movie review</button>
  <button type="button" data-go="shelf">Walk over to my movie shelf</button>
  <button type="button" data-go="outside">Back outside</button>
</nav>

<!-- The door keypad: pops out of the one on the wall when you try the door. -->
<div class="h-pad" id="h-pad" hidden role="dialog" aria-modal="true" aria-labelledby="pad-title">
  <div class="h-pad-box">
    <p class="pad-title" id="pad-title">APT 4B · ENTER CODE</p>
    <div class="pad-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="pad-msg" id="pad-msg" role="status">Residents and guests only</p>
    <div class="pad-keys">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="clear" aria-label="Clear">✕</button><button type="button" data-k="0">0</button><button type="button" data-k="enter" aria-label="Enter">⏎</button>
    </div>
    <button type="button" class="pad-cancel" data-k="cancel">Cancel</button>
  </div>
</div>

<!-- Up close to a sleeping cat: an offer of pictures instead, and the pictures. -->
<div class="h-ask" id="h-ask" hidden role="dialog" aria-modal="true" aria-labelledby="ask-text">
  <div class="h-ask-box">
    <p class="ask-tag">// SHH</p>
    <p class="ask-text" id="ask-text"></p>
    <div class="ask-btns"><button type="button" data-a="yes">Yes</button><button type="button" data-a="no">No</button></div>
  </div>
</div>
<div class="h-photos" id="h-photos" hidden role="dialog" aria-modal="true" aria-labelledby="ph-title">
  <div class="h-photos-box">
    <p class="ph-title" id="ph-title"></p>
    <figure><img id="ph-img" alt=""><figcaption id="ph-cap"></figcaption></figure>
    <div class="ph-nav"><button type="button" data-p="prev" aria-label="Previous photo">←</button><span id="ph-count"></span><button type="button" data-p="next" aria-label="Next photo">→</button></div>
    <button type="button" class="ph-close" data-p="close">Close</button>
  </div>
</div>

<div class="h-load" id="h-load"><p>&gt;&gt; BOOTING APARTMENT…</p></div>
<div class="h-fallback"><p>The apartment needs WebGL, which this browser doesn't have on.</p><a class="btn btn-hot" href="./">Go to the regular site</a></div>


<script src="content.js?v=1793693448"></script>
<script src="shelf-data.js?v=1793693448"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module" src="house.js?v=1793693448"></script>
</body>
</html>
